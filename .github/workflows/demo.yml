name: Live SDL demo
on:
  push:
    branches: [main, codex/demo-evals-godot]
    paths: ['examples/sdl-beacon/**', 'tools/build_demo.py', '.github/workflows/demo.yml']
  pull_request:
    paths: ['examples/sdl-beacon/**', 'tools/build_demo.py', '.github/workflows/demo.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install pinned SDK and build
        shell: bash
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install 4.0.16
          "$RUNNER_TEMP/emsdk/emsdk" activate 4.0.16
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          python examples/sdl-beacon/build.py web
          python tools/build_demo.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: work/demo
  deploy:
    if: github.event_name != 'pull_request' && github.repository == 'infinuts/port2browser'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish original demo
        uses: actions/deploy-pages@v4
        id: deployment
