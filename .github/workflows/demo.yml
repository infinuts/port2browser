name: Live game demo
on:
  push:
    branches: [main]
    paths: ['examples/sdl-beacon/**', 'examples/mosslight/**', 'examples/assaultcube/**', 'tools/package_assaultcube.py', 'tools/build_demo.py', '.github/workflows/demo.yml', '.github/actions/setup-emsdk/**']
  pull_request:
    paths: ['examples/sdl-beacon/**', 'examples/mosslight/**', 'examples/assaultcube/**', 'tools/package_assaultcube.py', 'tools/build_demo.py', '.github/workflows/demo.yml', '.github/actions/setup-emsdk/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install pinned Emscripten
        uses: ./.github/actions/setup-emsdk
      - name: Install pinned SDK and build
        shell: bash
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          python examples/sdl-beacon/build.py web
          python examples/mosslight/build.py debug-web
          python examples/mosslight/build.py web
          python examples/assaultcube/build.py
          python tools/build_demo.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: work/demo
  deploy:
    if: github.event_name != 'pull_request' && github.repository == 'infinuts/port2browser'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish demos (AssaultCube code only; no stock media)
        uses: actions/deploy-pages@v4
        id: deployment
